<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kartenbinder</title>
<meta name="theme-color" content="#121419">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23fff' stroke='%23222' stroke-width='5'/%3E%3Cpath d='M3 32a29 29 0 0 1 58 0z' fill='%23e8432f' stroke='%23222' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23fff' stroke='%23222' stroke-width='5'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#121419; --panel:#1a1d24; --panel2:#22262f; --line:#2c313c; --text:#eceef3; --muted:#8e96a6;
  --accent:#ff5b3d; --accent-ink:#fff; --ok:#3fcf8e; --warn:#ffc94d; --danger:#ff6b6b;
  --d:#8fb6ff; --s:#ffd257; --c:#f3b13b; --sh:#d68cff;
  --r:12px; --shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f3f4f7; --panel:#fff; --panel2:#eceef3; --line:#dde0e7; --text:#171a21; --muted:#677083;
    --d:#3f74d9; --s:#c08a00; --c:#b9780b; --sh:#9a4fd0; --shadow:0 10px 30px rgba(20,25,40,.12); color-scheme:light; }
}
body[data-sec="pocket"]{ --accent:#3d9bff; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{line-height:1.2;margin:0}
.muted{color:var(--muted)}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:58px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em;text-decoration:none;font-size:18px;white-space:nowrap}
.brand svg{width:26px;height:26px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs a{text-decoration:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs a.on{background:var(--accent);color:var(--accent-ink)}
.spacer{flex:1}
.sync{font-size:13px;color:var(--muted);white-space:nowrap;background:none;border:0;padding:6px 8px;border-radius:8px}
.sync:hover{background:var(--panel)}
.sync.dirty{color:var(--warn)}
.sync.ok{color:var(--ok)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:18px}
.subnav{border-bottom:1px solid var(--line)}
.subnav .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.subnav a{padding:12px 14px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
.subnav a.on{color:var(--text);border-color:var(--accent)}
main{padding:22px 0 60px}

/* generic */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:14px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
input[type=search],input[type=text],input[type=password],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}
.toolbar input[type=search]{flex:1 1 200px;max-width:340px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font-size:14px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--panel2);color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--text);background:color-mix(in srgb,var(--accent) 16%,var(--panel))}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);user-select:none;cursor:pointer}
.switch input{appearance:none;width:36px;height:20px;border-radius:99px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:.15s}
.switch input::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:18px}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.b2 i{background:var(--ok)}
.q2{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-3px}
.stat .bar{margin-top:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.loading::before{content:"";display:block;width:28px;height:28px;margin:0 auto 12px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err{padding:18px;border:1px solid var(--danger);border-radius:var(--r);color:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:8px}
.stat{padding:14px 16px}
.stat b{display:block;font-size:24px;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted)}
.rar{font-size:12px;letter-spacing:-1px;white-space:nowrap}
.r-d{color:var(--d)} .r-s{color:var(--s)} .r-c{color:var(--c)} .r-sh{color:var(--sh)}

/* card grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:14px 12px}
.tile{position:relative;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:5px;-webkit-tap-highlight-color:transparent}
.tile .img{position:relative;aspect-ratio:245/337;border-radius:7px;overflow:hidden;background:var(--panel2);transition:transform .12s}
.tile:hover .img{transform:translateY(-2px)}
.tile:active .img{transform:scale(.97)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile.miss img{filter:grayscale(1) brightness(.6);opacity:.45}
.tile.own .img{box-shadow:0 0 0 2px var(--accent)}
.tile .ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:12px;color:var(--muted);font-weight:600}
.img.broken .ph{display:flex}
.img.broken img{display:none}
.badge{position:absolute;top:5px;right:5px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:800;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tile .meta{display:flex;gap:6px;align-items:baseline;font-size:12px;min-width:0}
.tile .num{color:var(--muted);flex:none}
.tile .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.tile .sub{font-size:11px;color:var(--muted);margin-top:-3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* sets */
.serie{margin:28px 0 12px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.set{display:flex;flex-direction:column;gap:9px;padding:14px;text-decoration:none;transition:border-color .12s}
.set:hover{border-color:var(--muted)}
.set .logo{height:58px;display:flex;align-items:center;justify-content:center;position:relative}
.set .logo img{max-height:58px;max-width:100%;object-fit:contain}
.set .logo .ph{display:none;font-weight:800;font-size:18px;color:var(--muted)}
.set .logo.broken .ph{display:block}
.set .logo.broken img{display:none}
.set h3{font-size:15px}
.set .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.set.has{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.set .groups{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.set-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.set-head .logo{width:200px;height:84px;display:flex;align-items:center;justify-content:center}
.set-head .logo img{max-width:100%;max-height:84px;object-fit:contain}
.set-head .logo .ph{display:none;font-size:26px;font-weight:800;color:var(--muted)}
.set-head .logo.broken .ph{display:block}
.set-head .logo.broken img{display:none}
.set-head .info{flex:1;min-width:240px}
.set-head h1{font-size:26px;letter-spacing:-.02em}
.headstats{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:14px;align-items:center}
.headstats .bar{width:220px}
.group-title{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px}
.group-title h2{font-size:18px}
.group-title a{font-size:13px;color:var(--muted)}

/* pocket packs */
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:18px}
.pack{padding:12px 14px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);display:flex;flex-direction:column;gap:6px}
.pack.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.pack.gone .big,.pack.gone b{color:var(--muted)}
.avail{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:normal}
.avail.soon{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--text)}
.avail.gone{background:var(--panel2);color:var(--muted)}
.adv .gone-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.adv .gone-list a{grid-template-columns:1fr auto;opacity:.75}
.pack b{font-size:15px}
.pack .big{font-size:22px;font-weight:800;letter-spacing:-.02em}
.pack small{color:var(--muted);font-size:12px}
.adv{display:flex;flex-direction:column;gap:8px}
.adv a{display:grid;grid-template-columns:34px 1fr 150px 110px 110px;gap:14px;align-items:center;padding:12px 16px;text-decoration:none}
.adv a:hover{border-color:var(--muted)}
.adv .rank{font-weight:800;color:var(--muted);font-size:18px}
.adv .nm b{display:block}
.adv .nm span{font-size:13px;color:var(--muted)}
.adv .k{font-size:12px;color:var(--muted)}
.adv .v{font-weight:800;font-size:16px}
.note{font-size:13px;color:var(--muted);margin-top:18px;max-width:780px}

/* modal */
dialog{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:16px;padding:0;max-width:860px;width:calc(100% - 24px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(5,7,12,.65);backdrop-filter:blur(3px)}
.m-close{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);font-size:18px;line-height:1;z-index:2}
.card-detail{display:grid;grid-template-columns:minmax(0,330px) 1fr;gap:24px;padding:22px}
.card-detail .big{aspect-ratio:600/825;border-radius:14px;overflow:hidden;background:var(--panel2);position:relative}
.card-detail .big img{width:100%;height:100%;object-fit:contain;display:block}
.card-detail .big .ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted)}
.card-detail .big.broken .ph{display:flex}
.card-detail .big.broken img{display:none}
.card-detail h2{font-size:24px;letter-spacing:-.02em;padding-right:40px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:14px 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.sec-t{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:18px 0 8px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.stepper:last-child{border:0}
.stepper .ctl{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-size:18px;font-weight:700;line-height:1}
.stepper output{min-width:30px;text-align:center;font-weight:800;font-size:17px}
.m-nav{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:-6px 44px -8px 0;font-size:13px;color:var(--muted)}
.m-nav button{width:36px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-size:20px;line-height:1}
.m-nav button:disabled{opacity:.3;cursor:default}
.m-nav .hint{margin-left:auto;font-size:12px}
.setnav{display:flex;justify-content:space-between;gap:12px;margin:-6px 0 16px;font-size:13px}
.setnav a{color:var(--muted);text-decoration:none;padding:6px 12px;border:1px solid var(--line);border-radius:99px;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setnav a:hover{color:var(--text);border-color:var(--muted)}
.seg button small{opacity:.7;font-weight:500;margin-left:3px}
@media (max-width:720px){.m-nav .hint{display:none}}
.wishmark{position:absolute;top:5px;left:5px;width:22px;height:22px;border-radius:50%;background:var(--warn);color:#2a2000;font-size:13px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.wishbtn{margin:10px 0 0}
.wishbtn.on{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,var(--panel))}
.sortsel{padding:7px 10px}
.gridopts{display:contents}.gridopts.off,.binderopts.off{display:none}
.binder{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:18px}
.bpage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.bpage-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:10px;font-weight:600}
.bgrid{display:grid;gap:10px}
.bgrid .tile .nm{display:none}
.bslot{aspect-ratio:245/337;border:1px dashed var(--line);border-radius:7px;margin-bottom:22px}
.deck-edit{display:grid;grid-template-columns:minmax(0,380px) 1fr;gap:18px;align-items:start}
.deck-in{padding:16px;display:flex;flex-direction:column;gap:10px}
.deck-in textarea{width:100%;min-height:340px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}
.deck-in input{width:100%}
.dsum{padding:14px 16px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.dsum b{font-size:20px}
.dwarn{font-size:13px;color:var(--warn)}
.drows{display:flex;flex-direction:column;gap:6px}
.drow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:8px 12px;text-align:left;width:100%}
.drow img{width:40px;border-radius:4px;display:block}
.drow .dn b{display:block;font-size:14px}
.drow .dn span{font-size:12px;color:var(--muted)}
.drow .ds{font-weight:800;font-size:15px;text-align:right;white-space:nowrap}
.drow.ok .ds{color:var(--ok)}
.drow.miss .ds{color:var(--danger)}
.drow.part .ds{color:var(--warn)}
.drow.unk{opacity:.7}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.deckcard{padding:14px;text-decoration:none;display:flex;flex-direction:column;gap:8px}
.deckcard:hover{border-color:var(--muted)}
.deckcard h3{font-size:16px}
.deckcard .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
@media (max-width:720px){.deck-edit{grid-template-columns:1fr}.deck-in textarea{min-height:220px}}
.stepper .seg button{width:auto;min-width:32px;height:28px;border:0;background:none;font-size:14px}
.stepper .seg button.on{background:var(--accent);color:var(--accent-ink)}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields textarea{grid-column:1/-1}
.packlist{display:flex;flex-direction:column;gap:6px}
.packlist div{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--panel2);border-radius:9px;font-size:14px}
.packlist b{font-variant-numeric:tabular-nums}
.settings{padding:24px;display:flex;flex-direction:column;gap:14px;max-height:85vh;overflow:auto}
.settings h2{font-size:20px}
.settings p{margin:0;font-size:14px;color:var(--muted)}
.settings .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.settings label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.settings .row{display:flex;gap:8px;flex-wrap:wrap}
hr{border:0;border-top:1px solid var(--line);margin:4px 0}

#banner:not(:empty){background:color-mix(in srgb,var(--warn) 18%,var(--panel));border-bottom:1px solid var(--line)}
#banner .wrap,#storeBanner .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;font-size:14px}
#storeBanner:not(:empty){background:color-mix(in srgb,var(--danger) 22%,var(--panel));border-bottom:1px solid var(--danger)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;transition:.2s;pointer-events:none;z-index:50;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.bad{background:var(--danger);color:#fff}
footer{font-size:12px;color:var(--muted);padding:24px 0 40px;border-top:1px solid var(--line)}

@media (max-width:720px){
  .top .wrap{gap:8px}
  .brand span{display:none}
  .tabs a{padding:6px 11px}
  .sync{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px 9px}
  .card-detail{grid-template-columns:1fr;padding:18px}
  .card-detail .big{max-width:280px;margin:0 auto;width:100%}
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:18px 18px 0 0;max-height:92vh}
  .adv a{grid-template-columns:28px 1fr 90px;row-gap:4px}
  .adv a .hide-s{display:none}
  .set-head .logo{width:150px;height:64px}
  .set-head h1{font-size:22px}
  .settings .grid2,.fields{grid-template-columns:1fr}
}
</style>
</head>
<body data-sec="tcg">
<header class="top"><div class="wrap">
  <a class="brand" href="#/tcg"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="#fff" stroke="#222" stroke-width="5"/><path d="M3 32a29 29 0 0 1 58 0z" fill="#e8432f" stroke="#222" stroke-width="5"/><circle cx="32" cy="32" r="9" fill="#fff" stroke="#222" stroke-width="5"/></svg><span>Kartenbinder</span></a>
  <nav class="tabs"><a data-sec="tcg" href="#/tcg">Sammelkarten</a><a data-sec="pocket" href="#/pocket">TCG Pocket</a></nav>
  <div class="spacer"></div>
  <button id="syncState" class="sync" type="button"></button>
  <button id="btnSettings" class="icon-btn" type="button" title="Speichern &amp; Einstellungen" aria-label="Einstellungen">⚙︎</button>
</div></header>
<div id="storeBanner" role="alert"></div>
<div id="banner"></div>
<nav class="subnav"><div class="wrap" id="subnav"></div></nav>
<main><div class="wrap" id="view"></div></main>

<dialog id="modal"><button class="m-close" type="button" aria-label="Schließen">×</button><div id="modalBody"></div></dialog>
<dialog id="settingsDlg"><button class="m-close" type="button" aria-label="Schließen">×</button><div id="settingsBody"></div></dialog>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<div id="toast"></div>

<script>
'use strict';
/* ================= Basics ================= */

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};
const DAY = 864e5, WEEK = 7 * DAY;
const TDX = 'https://api.tcgdex.net/v2';
const PDB = 'https://cdn.jsdelivr.net/npm/pokemon-tcg-pocket-database@2/dist/';
const GH_IMG = 'https://raw.githubusercontent.com/flibustier/pokemon-tcg-exchange/main/public/images/';

/* ================= Speicher: IndexedDB „kartenbinder“ =================
   Store "kv":    collection, dirty, gh (GitHub-Einstellungen inkl. Token), ghSeen
   Store "cache": API-Antworten (URL -> {t, d}), Einträge älter als 7 Tage werden gelöscht
   localStorage:  nur "kartenbinder.settings" (Ansicht/Filter)                          */
const DB_NAME = 'kartenbinder', DB_VERSION = 1;
const SETTINGS_KEY = 'kartenbinder.settings';
const OLD_KEYS = { collection: 'kb.collection', dirty: 'kb.dirty', gh: 'kb.gh', ghSeen: 'kb.ghSeen', settings: 'kb.settings' };
const OLD_CACHE_PREFIX = 'kb.c:https://api.tcgdex.net/';
let db = null;

function idbOpen() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('IndexedDB wird von diesem Browser nicht unterstützt'));
    let r;
    try { r = indexedDB.open(DB_NAME, DB_VERSION); } catch (e) { return rej(e); }
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      if (!d.objectStoreNames.contains('cache')) d.createObjectStore('cache');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error || new Error('Datenbank konnte nicht geöffnet werden'));
    r.onblocked = () => rej(new Error('Datenbank blockiert – bitte andere Tabs des Kartenbinders schließen und neu laden'));
  });
}
/* fn bekommt den Object Store; gibt sie einen Request zurück, wird dessen Ergebnis geliefert.
   Erfolgreich ist erst, was die Transaktion vollständig geschrieben hat (oncomplete). */
function idbTx(store, mode, fn) {
  return new Promise((res, rej) => {
    if (!db) return rej(new Error('Datenbank nicht geöffnet'));
    let tx, out, req;
    try { tx = db.transaction(store, mode); req = fn(tx.objectStore(store)); } catch (e) { return rej(e); }
    if (req) req.onsuccess = () => { out = req.result; };
    tx.oncomplete = () => res(out);
    tx.onerror = () => rej(tx.error || (req && req.error) || new Error('Speichern fehlgeschlagen'));
    tx.onabort = () => rej(tx.error || new Error('Speichern abgebrochen'));
  });
}
const idbGet = (store, k) => idbTx(store, 'readonly', s => s.get(k));

/* Schreib-Warteschlange: fasst schnelle Änderungen zusammen, wiederholt nach Fehlern */
const pendingSaves = new Map();
let flushing = null, storeErr = null;
function queueSave(key, value) {
  pendingSaves.set(key, value);
  if (!flushing) flushing = flushSaves();
  return flushing;
}
async function flushSaves() {
  await Promise.resolve();
  try {
    while (pendingSaves.size) {
      if (!db) { pendingSaves.clear(); storageFail(null, true); return; }
      const items = [...pendingSaves]; pendingSaves.clear();
      try {
        await idbTx('kv', 'readwrite', s => { for (const [k, v] of items) s.put(v, k); });
        storageOk();
      } catch (e) {
        for (const [k, v] of items) if (!pendingSaves.has(k)) pendingSaves.set(k, v);
        storageFail(e);
        return;
      }
    }
  } finally { flushing = null; }
}
function storageFail(e, noDb) {
  storeErr = e || new Error('no-db');
  const quota = e && (e.name === 'QuotaExceededError' || /quota/i.test(e.message || ''));
  const msg = noDb
    ? 'Dieser Browser erlaubt hier keine dauerhafte Speicherung (IndexedDB nicht verfügbar, z. B. im privaten Fenster). Änderungen gehen beim Schließen der Seite verloren.'
    : quota ? 'Der Browser-Speicher ist voll – deine letzten Änderungen sind NICHT gespeichert.'
      : `Deine letzten Änderungen konnten nicht gespeichert werden (${(e && (e.message || e.name)) || 'unbekannter Fehler'}).`;
  $('#storeBanner').innerHTML = `<div class="wrap"><span>⚠ ${esc(msg)} Bitte exportiere die Sammlung als Sicherung.</span>`
    + `<button class="btn primary" type="button" data-sb="export">⬇ Exportieren</button>`
    + (noDb ? '' : `<button class="btn" type="button" data-sb="retry">Erneut speichern</button>`) + `</div>`;
}
function storageOk() {
  if (!storeErr) return;
  storeErr = null; $('#storeBanner').innerHTML = ''; toast('Gespeichert ✓');
}
$('#storeBanner').addEventListener('click', e => {
  const a = e.target.dataset && e.target.dataset.sb;
  if (a === 'export') exportCol();
  if (a === 'retry') { queueSave('collection', col); queueSave('dirty', dirty); if (gh) queueSave('gh', gh); if (ghSeen) queueSave('ghSeen', ghSeen); }
});
window.addEventListener('beforeunload', e => { if (pendingSaves.size || flushing || (storeErr && db)) { e.preventDefault(); e.returnValue = ''; } });

async function pruneCache() {
  if (!db) return;
  const limit = Date.now() - WEEK;
  await idbTx('cache', 'readwrite', s => {
    const r = s.openCursor();
    r.onsuccess = () => { const c = r.result; if (!c) return; if (!c.value || !(c.value.t > limit)) c.delete(); c.continue(); };
  });
}
const clearCache = () => idbTx('cache', 'readwrite', s => { s.clear(); });

/* Start: Datenbank öffnen, alten localStorage-Stand übernehmen, danach alte Schlüssel entfernen */
async function initStore() {
  try {
    db = await idbOpen();
    db.onversionchange = () => { db.close(); db = null; storageFail(new Error('Datenbank wurde in einem anderen Tab aktualisiert – bitte Seite neu laden')); };
  } catch (e) { db = null; storageFail(e, true); }

  let stored = null;
  if (db) {
    try {
      const [c, d, g, s] = await Promise.all(['collection', 'dirty', 'gh', 'ghSeen'].map(k => idbGet('kv', k)));
      stored = c || null; dirty = !!d; gh = g || null; ghSeen = s || null;
    } catch (e) { storageFail(e); }
  }

  // Migration aus dem localStorage (Version vor der Umstellung)
  const oldCol = LS.get(OLD_KEYS.collection, null), oldGh = LS.get(OLD_KEYS.gh, null);
  const writes = [];
  let useOld = false;
  if (oldCol && (!stored || (oldCol.updated || '') > (stored.updated || ''))) {
    useOld = true; stored = oldCol;
    dirty = !!LS.get(OLD_KEYS.dirty, false); ghSeen = LS.get(OLD_KEYS.ghSeen, null);
    writes.push(['collection', oldCol], ['dirty', dirty], ['ghSeen', ghSeen]);
  }
  const useOldGh = !!(oldGh && !gh);
  if (useOldGh) { gh = oldGh; writes.push(['gh', oldGh]); }
  if (db && writes.length) {
    try {
      await idbTx('kv', 'readwrite', s => { for (const [k, v] of writes) s.put(v, k); });
      const back = await Promise.all(writes.map(([k]) => idbGet('kv', k)));
      const verified = writes.every(([, v], i) => JSON.stringify(back[i] ?? null) === JSON.stringify(v ?? null));
      if (!verified) throw new Error('Prüfung nach der Übernahme fehlgeschlagen');
      if (useOld) for (const k of ['collection', 'dirty', 'ghSeen']) try { localStorage.removeItem(OLD_KEYS[k]); } catch { }
      if (useOldGh) try { localStorage.removeItem(OLD_KEYS.gh); } catch { }
      if (useOld) setTimeout(() => toast('Sammlung in die neue Datenbank übernommen ✓'), 600);
    } catch (e) { storageFail(e); }  // alte Schlüssel bleiben dann unangetastet
  } else if (db && oldCol) {
    // Datenbank ist bereits neuer – der alte Stand ist überholt
    for (const k of ['collection', 'dirty', 'ghSeen']) try { localStorage.removeItem(OLD_KEYS[k]); } catch { }
  }
  if (db && oldGh && !useOldGh) try { localStorage.removeItem(OLD_KEYS.gh); } catch { }

  // Alter API-Zwischenspeicher (nur eigene, eindeutig erkennbare Schlüssel) – lässt sich jederzeit neu laden
  try {
    const ks = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(OLD_CACHE_PREFIX)) ks.push(k); }
    ks.forEach(k => localStorage.removeItem(k));
  } catch { }

  // Ansichts-Einstellungen unter neuen Schlüssel umziehen
  const oldSettings = LS.get(OLD_KEYS.settings, null);
  if (oldSettings && LS.get(SETTINGS_KEY, null) == null) { Object.assign(S, oldSettings); if (LS.set(SETTINGS_KEY, S)) try { localStorage.removeItem(OLD_KEYS.settings); } catch { } }
  else if (oldSettings) try { localStorage.removeItem(OLD_KEYS.settings); } catch { }

  hadLocal = !!stored;
  col = normalizeCol(stored);

  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persisted().then(p => p || navigator.storage.persist()).catch(() => { });
  }
  pruneCache().catch(() => { });
}

/* fetch mit Memory-Cache und optionalem IndexedDB-Cache (cache = Gültigkeit in ms) */
const memo = new Map();
function getJSON(url, { cache = 0 } = {}) {
  if (memo.has(url)) return memo.get(url);
  const p = (async () => {
    if (cache && db) { try { const c = await idbGet('cache', url); if (c && Date.now() - c.t < cache) return c.d; } catch { } }
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    if (cache && db) idbTx('cache', 'readwrite', s => { s.put({ t: Date.now(), d }, url); }).catch(() => { });
    return d;
  })();
  memo.set(url, p); p.catch(() => memo.delete(url));
  return p;
}
async function pool(items, n, fn) {
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) { const k = i++; await fn(items[k], k); } }));
}

/* ================= Settings & collection ================= */
const S = Object.assign({ tcgLang: 'de', quickTcg: false, quickPocket: true, quickPocketN: 2, tcgF: 'all', pocketF: 'all', tcgView: 'grid', binderSize: 9, tcgSort: 'num', pocketSort: 'num', colSort: 'set', wishOpenOnly: true, pWishOpenOnly: true, advMode: 'new', adv2: false, groups: ['Diamond', 'Star', 'Shiny', 'Crown'], onlyOwnedSets: false }, LS.get(SETTINGS_KEY, {}));
let settingsWarned = false;
const saveSettings = () => {
  if (!LS.set(SETTINGS_KEY, S) && !settingsWarned) {
    settingsWarned = true;
    toast('Ansichts-Einstellungen konnten nicht gespeichert werden (localStorage voll). Deine Sammlung ist davon nicht betroffen.', true);
  }
};

function emptyCol() { return { schema: 1, updated: null, tcg: {}, pocket: {}, wish: { tcg: {}, pocket: {} }, decks: [] }; }
function normalizeCol(d) {
  const c = emptyCol(), obj = x => x && typeof x === 'object' && !Array.isArray(x);
  if (obj(d)) {
    c.updated = d.updated || null;
    c.tcg = obj(d.tcg) ? d.tcg : {};
    c.pocket = obj(d.pocket) ? d.pocket : {};
    if (obj(d.wish)) { c.wish.tcg = obj(d.wish.tcg) ? d.wish.tcg : {}; c.wish.pocket = obj(d.wish.pocket) ? d.wish.pocket : {}; }
    c.decks = Array.isArray(d.decks) ? d.decks.filter(obj) : [];
  }
  return c;
}
let col = emptyCol(), hadLocal = false, dirty = false, gh = null, ghSeen = null;

function persist() { queueSave('collection', col); }
function setDirty(v) { dirty = v; queueSave('dirty', v); updateSyncState(); }
function setGh(cfg) { gh = cfg; queueSave('gh', cfg); }
function setSeen(v) { ghSeen = v; queueSave('ghSeen', v); }
function saveCol() {
  col.updated = new Date().toISOString();
  persist(); setDirty(true); scheduleAutoSync();
}

/* ================= GitHub sync ================= */
function ghDefaults() {
  const h = location.hostname, owner = h.endsWith('.github.io') ? h.split('.')[0] : '';
  const first = location.pathname.split('/').filter(Boolean)[0];
  const repo = first && !first.includes('.') ? first : (owner ? owner + '.github.io' : '');
  return { owner, repo, branch: 'main', path: DATA_FILE, token: '', auto: true };
}
const ghCfg = () => Object.assign(ghDefaults(), gh || {});
const b64enc = s => { const b = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));
const ghUrl = c => `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${c.path.split('/').map(encodeURIComponent).join('/')}`;
const ghHeaders = c => ({ Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + c.token });
async function ghGet(c) {
  const r = await fetch(ghUrl(c) + '?ref=' + encodeURIComponent(c.branch) + '&t=' + Date.now(), { headers: ghHeaders(c), cache: 'no-store' });
  if (r.status === 404) return { sha: null, data: null };
  if (!r.ok) throw new Error(r.status === 401 ? 'Token ungültig (401)' : `GitHub ${r.status}`);
  const j = await r.json();
  return { sha: j.sha, data: j.content ? JSON.parse(b64dec(j.content)) : null };
}
async function ghPut(c, data, sha) {
  const body = { message: `Sammlung aktualisiert (${new Date().toLocaleString('de-DE')})`, content: b64enc(JSON.stringify(data, null, 1) + '\n'), branch: c.branch };
  if (sha) body.sha = sha;
  const r = await fetch(ghUrl(c), { method: 'PUT', headers: { ...ghHeaders(c), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) { let m = `GitHub ${r.status}`; try { m += ': ' + (await r.json()).message; } catch { } throw new Error(m); }
}
let syncing = false, autoT;
function scheduleAutoSync() {
  const c = ghCfg(); if (!c.token || !c.auto) return;
  clearTimeout(autoT); autoT = setTimeout(() => syncNow(true), 8000);
}
async function syncNow(silent) {
  const c = ghCfg();
  if (!c.token) { openSettings(); return; }
  if (syncing) return; syncing = true; updateSyncState();
  try {
    const remote = await ghGet(c);
    const ru = remote.data && remote.data.updated, lastSeen = ghSeen;
    if (ru && ru !== lastSeen && col.updated && ru > col.updated && !confirm('Auf GitHub liegt ein neuerer Stand (von einem anderen Gerät?). Trotzdem mit diesem Gerät überschreiben?')) return;
    await ghPut(c, col, remote.sha);
    setSeen(col.updated);
    setDirty(false);
    if (!silent) toast('Auf GitHub gespeichert ✓');
  } catch (e) { toast('Speichern auf GitHub fehlgeschlagen – ' + e.message, true); }
  finally { syncing = false; updateSyncState(); }
}
function updateSyncState() {
  const el = $('#syncState'), c = ghCfg();
  el.className = 'sync';
  if (syncing) { el.textContent = 'Speichere …'; return; }
  if (c.token) {
    if (dirty) { el.textContent = '● Nicht auf GitHub gespeichert'; el.classList.add('dirty'); }
    else { el.textContent = '✓ Auf GitHub gespeichert'; el.classList.add('ok'); }
  } else {
    if (dirty) { el.textContent = '● Nur in diesem Browser'; el.classList.add('dirty'); }
    else el.textContent = 'Gespeichert';
  }
}
async function fetchRemote() {
  const c = ghCfg();
  if (c.token && c.owner && c.repo) return (await ghGet(c)).data;
  const r = await fetch(DATA_FILE + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) return null;
  return await r.json();
}
function showBanner(html) { $('#banner').innerHTML = html ? `<div class="wrap">${html}</div>` : ''; }
async function checkRemote() {
  let rd;
  try { rd = await fetchRemote(); } catch { return; }
  if (!rd || !rd.updated) return;
  rd = normalizeCol(rd);
  if (rd.updated === col.updated) return;
  const apply = () => { col = rd; persist(); setDirty(false); setSeen(rd.updated); showBanner(''); route(); };
  if (!hadLocal || (!dirty && (!col.updated || rd.updated > col.updated))) { apply(); if (hadLocal) toast('Neuester Stand geladen'); return; }
  if (rd.updated > (col.updated || '')) {
    showBanner(`<span>Es gibt einen neueren gespeicherten Stand vom ${new Date(rd.updated).toLocaleString('de-DE')}.</span><button class="btn primary" id="bnLoad">Übernehmen</button><button class="btn" id="bnKeep">Diesen Browser behalten</button>`);
    $('#bnLoad').onclick = apply; $('#bnKeep').onclick = () => showBanner('');
  }
}

/* export / import */
function exportCol() {
  const blob = new Blob([JSON.stringify(col, null, 1) + '\n'], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = DATA_FILE; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  if (!ghCfg().token) setDirty(false);
}
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const raw = JSON.parse(await f.text());
    const isObj = x => x && typeof x === 'object' && !Array.isArray(x);
    if (!isObj(raw) || !(isObj(raw.tcg) || isObj(raw.pocket))) throw new Error('Das ist keine Kartenbinder-Sammlung (sammlung.json).');
    const d = normalizeCol(raw);
    const n = Object.keys(d.tcg).length + Object.keys(d.pocket).length;
    if (!confirm(`Datei enthält ${n} Karten-Einträge. Aktuelle Sammlung in diesem Browser ersetzen?`)) return;
    col = d; saveCol(); $('#settingsDlg').close(); route(); toast('Importiert ✓');
  } catch (err) { toast('Datei konnte nicht gelesen werden: ' + err.message, true); }
});

    <div class="grid2">
      <label>Benutzer / Organisation<input type="text" id="ghOwner" value="${esc(c.owner)}" autocomplete="off"></label>
      <label>Repository<input type="text" id="ghRepo" value="${esc(c.repo)}" autocomplete="off"></label>
      <label>Branch<input type="text" id="ghBranch" value="${esc(c.branch)}" autocomplete="off"></label>

function route() {

  const q = new URLSearchParams(qs || '');

  const sub = parts[1] || '';

  for (const a of document.querySelectorAll('.tabs a')) a.classList.toggle('on', a.dataset.sec === sec);
  const subOn = sub === 'set' ? (sec === 'tcg' ? 'sets' : '') : sub === 'deck' ? 'decks' : sub;

  if (sec === 'tcg') {
    if (sub === 'sets') viewTcgSets();
    else if (sub === 'set') viewTcgSet(parts[2]);
    else if (sub === 'search') viewTcgSearch(q.get('q') || '');

    else if (sub === 'decks') viewPocketDecks();
    else if (sub === 'deck') viewPocketDeck(parts[2]);

}

/* ================= TCG (physisch) ================= */
const VAR_LABEL = { normal: 'Normal', reverse: 'Reverse Holo', holo: 'Holo', firstEdition: '1. Edition' };
const LANGS = { de: 'Deutsch', en: 'Englisch', ja: 'Japanisch', fr: 'Französisch', it: 'Italienisch', es: 'Spanisch', other: 'Andere' };
const CONDS = { '': '–', M: 'Mint', NM: 'Near Mint', EX: 'Excellent', GD: 'Good', LP: 'Light Played', PL: 'Played', PO: 'Poor' };
const tcgTotal = e => e ? Object.values(e.v || {}).reduce((a, b) => a + (+b || 0), 0) : 0;
const tcgCount = id => tcgTotal(col.tcg[id]);
const isWishT = id => !!col.wish.tcg[id];
const enBase = (serie, set, localId) => serie ? `https://assets.tcgdex.net/en/${serie}/${set}/${localId}` : '';
function tcgSrcs(base, en, q = 'low') { return [base && `${base}/${q}.webp`, en && en !== base && `${en}/${q}.webp`]; }
function setCounts() { const m = {}; for (const e of Object.values(col.tcg)) if (tcgTotal(e) > 0) m[e.set] = (m[e.set] || 0) + 1; return m; }
function entryValue(e) {
  const p = e.price; if (!p) return null;
  let sum = 0, any = false;
  for (const [k, n] of Object.entries(e.v || {})) {
    if (!n) continue;
    const unit = (k === 'holo' || k === 'reverse') ? (p.trendHolo ?? p.trend) : p.trend;
    if (unit != null) { sum += unit * n; any = true; }
  }
  return any ? sum : null;
}
function tcgEntryTile(id) {
  const e = col.tcg[id];
  return tile({ key: id, srcs: tcgSrcs(e.img, enBase(e.serie, e.set, e.num)), name: e.name, num: e.num, count: tcgTotal(e), wish: isWishT(id) });
}
function tcgQuickToggle(id, meta) {
  const e = col.tcg[id], t = tcgTotal(e);
  if (t > 1 || (e && (e.note || e.cond))) return false;
  if (t === 1) delete col.tcg[id];
  else { col.tcg[id] = { ...meta, v: { normal: 1 }, added: new Date().toISOString() }; fillTcgDetails(id); }
  saveCol(); return true;
}
/* holt Seltenheit & Preis nach, wenn eine Karte per Schnellerfassung angelegt wurde */
async function fillTcgDetails(id) {
  const e = col.tcg[id]; if (!e) return;
  for (const l of [e.cardLang || S.tcgLang, 'en']) {
    try {
      const c = await getJSON(`${TDX}/${l}/cards/${encodeURIComponent(id)}`);
      const cm = c.pricing && c.pricing.cardmarket, cur = col.tcg[id];
      if (!cur) return;
      if (cm) cur.price = { trend: cm.trend ?? cm.avg ?? null, avg30: cm.avg30 ?? null, trendHolo: cm['trend-holo'] ?? null, at: cm.updated || new Date().toISOString() };
      if (c.rarity) cur.rarity = c.rarity;
      persist(); scheduleAutoSync(); return;
    } catch { }
  }
}

    for (const id of ids) {
      const e = col.tcg[id]; copies += tcgTotal(e);
      const v = entryValue(e); if (v != null) { value += v; priced++; if (!oldest || e.price.at < oldest) oldest = e.price.at; }
    }

    if (!ids.length) {
      V.innerHTML = `<div class="panel empty"><h2 style="margin-bottom:8px">Noch keine Sammelkarten erfasst</h2><p>Öffne ein Set, tippe die Karten an, die du besitzt – oder suche eine Karte direkt.</p><p><a class="btn primary" href="#/tcg/sets">Sets durchsuchen</a> <a class="btn" href="#/tcg/search">Karte suchen</a></p></div>`;

      (groups[e.set] = groups[e.set] || { name: e.setName, ids: [], last: '' }).ids.push(id);
      if ((e.added || '') > groups[e.set].last) groups[e.set].last = e.added || '';
    }

    const CS = { added: (a, b) => (col.tcg[b].added || '').localeCompare(col.tcg[a].added || ''), name: (a, b) => col.tcg[a].name.localeCompare(col.tcg[b].name, 'de'), value: (a, b) => (entryValue(col.tcg[b]) ?? -1) - (entryValue(col.tcg[a]) ?? -1) };

      </div>
      ${sortMode !== 'set' ? (flat.length ? `<div class="grid">${flat.sort(CS[sortMode]).map(id => tcgEntryTile(id).replace('</button>', `<div class="sub">${esc(col.tcg[id].setName || col.tcg[id].set)}${sortMode === 'value' && entryValue(col.tcg[id]) != null ? ' · ' + eur(entryValue(col.tcg[id])) : ''}</div></button>`)).join('')}</div>` : '<div class="empty">Keine Treffer.</div>')
        : order.map(([set, g]) => `<div class="group-title"><h2>${esc(g.name || set)}</h2><a href="#/tcg/set/${encodeURIComponent(set)}">${g.ids.length} Karten · Set öffnen →</a></div>

    $('#btnPrices', V).onclick = refreshPrices;
  };
  async function refreshPrices() {

/* ================= TCG Pocket ================= */
const RAR = {

const ck = key => (P && P.canon && P.canon.get(key)) || key;

function canonizePocket() {

  for (const store of [col.pocket, col.wish.pocket]) {
    for (const k of Object.keys(store)) {
      const c = ck(k); if (c === k) continue;
      if (store === col.pocket) store[c] = Math.max(+store[c] || 0, +store[k] || 0); else store[c] = store[c] || store[k];

}

const rarIdx = r => { const i = RAR_ORDER.indexOf(r); return i < 0 ? 99 : i; };

async function pocketData() {
  if (P) return P;
  const [cards, sets, pull, rar, enDe] = await Promise.all([...['cards.min.json', 'sets.json', 'pullRates.json', 'rarities.json'].map(f => getJSON(PDB + f)), getJSON('pokemon-namen.json').catch(() => null)]);
  const data = { cards, pull, rar, setList: Object.values(sets).flat(), setMap: {}, bySet: {}, byKey: {}, deNames: {}, dePacks: {}, deAvail: new Set(), pools: new Map(), vars: new Map() };
  for (const s of data.setList) data.setMap[s.code] = s;
  for (const c of cards) { c.key = `${c.set}-${c.number}`; data.byKey[c.key] = c; (data.bySet[c.set] = data.bySet[c.set] || []).push(c); }
  for (const k in data.bySet) data.bySet[k].sort((a, b) => a.number - b.number);
  data.setList = data.setList.filter(s => data.bySet[s.code]);
  try { const s = await getJSON(`${TDX}/de/series/tcgp`, { cache: DAY }); data.deAvail = new Set(s.sets.map(x => x.id)); } catch { }
  if (enDe && typeof enDe === 'object') {
    const names = Object.keys(enDe).sort((a, b) => b.length - a.length).map(n => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    data.enDe = enDe; data.deCache = new Map();
    try { data.enDeRx = new RegExp(`(?<![A-Za-zÀ-ÿ])(${names.join('|')})(?![A-Za-zÀ-ÿ])`, 'g'); } catch { data.enDeRx = null; }
  }
  // gleiche Karte in mehreren Sets (gleiches Bild) → älteste Version ist kanonisch
  data.canon = new Map(); data.twins = new Map();
  const relIdx = new Map(data.setList.map((s, i) => [s.code, [s.releaseDate || '9999', i]]));
  const byImg = new Map();
  for (const c of cards) if (c.image) { if (!byImg.has(c.image)) byImg.set(c.image, []); byImg.get(c.image).push(c); }
  for (const g of byImg.values()) {
    if (g.length < 2) continue;
    g.sort((a, b) => { const x = relIdx.get(a.set) || ['9999', 999], y = relIdx.get(b.set) || ['9999', 999]; return x[0].localeCompare(y[0]) || x[1] - y[1] || a.number - b.number; });
    for (const c of g) data.canon.set(c.key, g[0].key);
    data.twins.set(g[0].key, g);
  }

}

/* ---- Pack-Verfügbarkeit ----

   until: Zeitpunkt (mit Zeitzone), ab dem das Pack weg ist; null = schon nicht mehr erhältlich. */
const PACK_END = {
  'A4b|*': { until: null },                          // Deluxepack-ex
  'B4b|*': { until: '2026-10-29T01:59:00+01:00' },   // Deluxepack: Mega – bis 29.10.2026, 01:59 Uhr

const packEnd = (code, p) => PACK_END[code + '|' + p] || PACK_END[code + '|*'] || null;

  const left = Date.parse(e.until) - Date.now();
  const soon = left < 2 * DAY ? ` (noch ${left < 3600e3 ? Math.max(1, Math.round(left / 60e3)) + ' Min.' : Math.round(left / 3600e3) + ' Std.'})` : '';
  return { gone: false, text: `nur noch bis ${fmtEnd(e.until)}${soon}` };
}
/* Option „2 von 2 mitzählen“ (Pack-Berater, Set-Ansicht, Übersicht) */
const newOpt = () => ({ target: S.adv2 ? 2 : 1 });
const L = () => S.adv2

  : { chance: 'Chance auf neue Karte', chancePack: 'Chance auf neue Karte pro Pack', exp: 'Ø neue Karten/Pack', expShort: 'neue/Pack', miss: 'fehlen', sort: 'Sortiert nach der Chance, mindestens eine Karte zu ziehen, die dir noch fehlt.' };

  const n = (packPools(c.set, pack)[c.rarity] || []).length; if (!n) return 0;

/* beste aktuell erhältliche Quelle unter mehreren Drucken einer Karte */
function bestSource(prints) {
  let best = null;
  for (const k of prints) for (const p of (k.packs || [])) {
    if (!P.pull[k.set] || !packOpen(k.set, p)) continue;
    const ch = cardChance(k, p); if (!best || ch > best.ch) best = { k, p, ch };
  }
  return best;
}
function sourceText(prints) {
  const b = bestSource(prints);
  if (b) return `${esc(packName(b.k.set, b.p))} · ${pct(b.ch)}/Pack`;
  return prints.some(k => (k.packs || []).length) ? 'in keinem erhältlichen Pack' : 'Promo / Event';
}

/* ================= Deck-Check (Pocket) ================= */
async function pocketExtra() {
  if (P.extra) return P.extra;
  const m = {};
  try { for (const c of await getJSON(PDB + 'cards.extra.json')) m[`${c.set}-${c.number}`] = c; } catch { }
  P.extra = m; P.sigs = null;
  return m;
}
/* Drucke derselben Karte (gleicher Name + gleiche Werte) gelten im Deck als austauschbar */
function sigOf(c) {
  const x = (P.extra && P.extra[c.key]) || {};
  if (x.type && x.type !== 'pokemon') return `${norm(c.name)}|${x.type}`;
  return `${norm(c.name)}|${x.health ?? ''}|${x.element ?? ''}|${x.stage ?? ''}|${x.retreatCost ?? ''}`;
}
function printsOf(c) {
  if (!P.sigs) { P.sigs = new Map(); for (const k of P.cards) { const s = sigOf(k); if (!P.sigs.has(s)) P.sigs.set(s, []); P.sigs.get(s).push(k); } }
  return P.sigs.get(sigOf(c)) || [c];
}
const findByName = name => { const n = norm(name); return n ? P.cards.filter(c => norm(c.name) === n || norm(pName(c)) === n) : []; };
const pickCanon = list => list.slice().sort((a, b) => rarIdx(a.rarity) - rarIdx(b.rarity) || (setIdxOf(a.set) - setIdxOf(b.set)) || a.number - b.number)[0];
const setIdxOf = code => { const i = P.setList.findIndex(s => s.code === code); return i < 0 ? 999 : i; };

function parseDeck(text) {
  const out = [];
  for (const raw of String(text || '').split(/\r?\n/)) {
    let line = raw.replace(/\t/g, ' ').replace(/\s+/g, ' ').trim(), m;
    if (!line || /^(#|\/\/)/.test(line)) continue;
    if (/^(pok[eé]mon|trainer|energ(y|ie)|deck|total|gesamt)\b[^a-z0-9]*\d*\s*$/i.test(line) || /^(pok[eé]mon|trainer|energ(y|ie))\s*[:(]/i.test(line)) continue;
    let n = 1;
    if ((m = line.match(/^(\d+)\s*[x×]?\s+(.+)$/i))) { n = +m[1]; line = m[2]; }
    else if ((m = line.match(/^(.+?)\s+[x×]\s*(\d+)$/i))) { n = +m[2]; line = m[1]; }
    let setCode = null, num = null;
    if ((m = line.match(/^(.*?)[\s(]+(P-[AB]|PROMO-[AB]|[A-Z]\d+[a-z]?)[\s\-#/]*0*(\d+)\)?$/))) { line = m[1]; setCode = m[2].replace(/^P-/, 'PROMO-'); num = +m[3]; }
    out.push({ raw: raw.trim(), n, name: line.replace(/[\s,;:\-]+$/, '').trim(), setCode, num });
  }
  return out;
}
function analyzeDeck(text) {
  const lines = parseDeck(text), rows = [], bySig = new Map(), byName = new Map();
  for (const l of lines) {
    let c = l.setCode ? P.byKey[`${l.setCode}-${l.num}`] : null, ambiguous = false;
    if (c && l.name && norm(c.name) !== norm(l.name) && norm(pName(c)) !== norm(l.name) && findByName(l.name).length) c = null;
    if (!c && l.name) { const alt = findByName(l.name); if (alt.length) { c = pickCanon(alt); ambiguous = new Set(alt.map(sigOf)).size > 1; } }
    const row = { l, c, ambiguous };
    if (c) {
      row.sig = sigOf(c); row.prints = printsOf(c);
      const g = bySig.get(row.sig) || { need: 0, have: [...new Set(row.prints.map(k => ck(k.key)))].reduce((a, k) => a + pc(k), 0), prints: row.prints, rows: [] };
      g.need += l.n; g.rows.push(row); bySig.set(row.sig, g);
      byName.set(norm(c.name), (byName.get(norm(c.name)) || 0) + l.n);
    }
    rows.push(row);
  }
  let okCards = 0, missing = 0, pts = 0;
  for (const g of bySig.values()) {
    const ok = Math.min(g.have, g.need); okCards += ok;
    const miss = g.need - ok; missing += miss;
    const minPts = Math.min(...g.prints.map(k => (P.rar[k.rarity] || {}).points).filter(v => v > 0));
    if (miss && Number.isFinite(minPts)) pts += miss * minPts;
  }
  const total = lines.reduce((a, l) => a + l.n, 0);
  const tooMany = [...byName.entries()].filter(([, n]) => n > 2).map(([k]) => k);
  return { rows, bySig, total, okCards, missing, pts, unknown: rows.filter(r => !r.c).length, tooMany };
}

          const info = cls === 'ok' ? (other.length && !pc(r.c.key) ? `vorhanden als ${other.map(k => `${k.set} #${k.number}`).join(', ')}` : 'vorhanden')
            : `holen: ${sourceText(g.prints)}`;
          return `<button type="button" class="panel drow ${cls}" data-key="${esc(r.c.key)}"><img src="${esc(thumb(r.c))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
            <span class="dn"><b>${r.l.n}× ${esc(pName(r.c))}</b><span>${esc(r.c.set)} #${r.c.number} · ${rarIcon(r.c.rarity)} · ${info}${r.ambiguous ? ' · ⚠ mehrere Versionen – Set + Nummer angeben' : ''}</span></span>
            <span class="ds">${Math.min(g.have, g.need)} / ${g.need}</span></button>`;
        }).join('')}</div>`;
  };
  let saveT;
  const save = () => { clearTimeout(saveT); saveT = setTimeout(() => { deck.text = $('#dText', V).value; deck.name = $('#dName', V).value.trim() || 'Ohne Namen'; deck.updated = new Date().toISOString(); saveCol(); }, 500); };
  $('#dText', V).oninput = () => { render(); save(); };
  $('#dName', V).oninput = save;
  V.onclick = e => {
    if (e.target.id === 'dDel') {
      if (!confirm(`Deck „${deck.name}“ löschen?`)) return;
      clearTimeout(saveT); col.decks = col.decks.filter(d => d.id !== deck.id); saveCol(); location.hash = '#/pocket/decks'; return;
    }
    if (e.target.id === 'dWish') {
      const a = analyzeDeck($('#dText', V).value); let n = 0;
      for (const g of a.bySig.values()) {
        if (g.have >= g.need) continue;
        const b = bestSource(g.prints), k = (b && b.k) || pickCanon(g.prints);
        if (!isWishP(k.key)) { setWishP(k.key, true); n++; }
      }
      if (n) saveCol();
      toast(n ? `${n} Karte${n === 1 ? '' : 'n'} auf die Wunschliste gesetzt ★` : 'Nichts zu tun – alles vorhanden oder schon auf der Wunschliste');
      return;
    }
    const r = e.target.closest('.drow[data-key]'); if (!r) return;
    openPocketCard(r.dataset.key, () => render(), [...new Set(keys)]);
  };
  render();
}

/* ================= Start ================= */
(async () => {
  V.innerHTML = loading('Lade Sammlung …');
  await initStore();
  window.addEventListener('hashchange', route);
  updateSyncState();
  route();
  checkRemote();
})();
</script>
